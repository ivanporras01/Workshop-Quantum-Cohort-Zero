name: Verify Workshop Quantum Cohort Zero
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/learning-experiences.js
      - run: node --check src/applied-waves-lab.js
      - run: node --check src/beginner-path.js
      - run: node --check src/qubit-lesson.js
      - run: node --check src/quantum-atlas.js
      - run: node --check src/quantum-models.js
      - run: node --check src/day-learning-map.js
      - run: node --check src/circuit-model.js
      - run: node --check src/circuit-lab.js
      - run: npm run build
      - run: |
          test -s dist/circuit-lab.html
          test -s dist/src/circuit-model.js
          test -s dist/src/circuit-lab.js
          test -s dist/src/circuit-lab.css
          test -s dist/index.html
          test -s dist/src/app.js
          test -s dist/src/styles.css
          test -s dist/src/agenda.json
          test -s dist/src/lessons.json
          test -s dist/src/bloch-sphere.js
          test -s dist/src/bloch-sphere.css
          test -s dist/src/learning-experiences.js
          test -s dist/src/learning-experiences.css
          test -s dist/src/applied-waves-lab.js
          test -s dist/src/applied-waves-lab.css
          test -s dist/src/applied-waves-circuit.svg
          test -s dist/src/beginner-path.js
          test -s dist/src/beginner-path.css
          test -s dist/src/qubit-lesson.js
          test -s dist/src/quantum-atlas.js
          test -s dist/src/quantum-atlas.css
          test -s dist/src/quantum-models.js
          test -s dist/src/quantum-concept-content.js
          test -s dist/src/day-learning-map.js
  live-production-check:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm Cloudflare serves all 18 lesson resources and workshop UI
        run: node scripts/verify-live.mjs
        env:
          WORKSHOP_URL: https://workshop-quantum-cohort-zero.hectorporras0916.workers.dev

  live-browser-check:
    needs: [verify, live-production-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise published workshop on desktop and mobile
        run: node scripts/verify-live-browser.mjs
        env:
          WORKSHOP_URL: https://workshop-quantum-cohort-zero.hectorporras0916.workers.dev


      - name: Exercise circuit builder, Bloch spheres and exports
        run: node scripts/verify-circuit-browser.mjs
        env:
          WORKSHOP_URL: https://workshop-quantum-cohort-zero.hectorporras0916.workers.dev
      - name: Save mobile circuit lab screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-lab-preview
          path: circuit-lab-mobile.png
          if-no-files-found: ignore

  qiskit-export-check:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install independent quantum reference implementation
        run: python -m pip install --disable-pip-version-check qiskit numpy
      - name: Generate reference circuits
        run: node scripts/check-circuit-qiskit.mjs "$RUNNER_TEMP/circuit-cases.json"
      - name: Compare every gate and its inverse with Qiskit
        run: python scripts/check-circuit-qiskit.py "$RUNNER_TEMP/circuit-cases.json"
