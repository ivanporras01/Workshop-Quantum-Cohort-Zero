name: Verify Workshop Quantum Cohort Zero
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - run: npm run build
      - run: |
          test -s dist/index.html
          test -s dist/src/app.js
          test -s dist/src/styles.css
          test -s dist/src/agenda.json